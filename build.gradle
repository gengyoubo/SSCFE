plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    mappings channel: mapping_channel, version: mapping_version
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
            workingDirectory project.file('build/gametest-run')
            mods {
                "${mod_id}" {
                    source sourceSets.test
                }
            }
        }
        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}
sourceSets.main.resources { srcDir 'src/generated/resources' }
repositories {
    maven {
        name = 'Curios'
        url = 'https://maven.theillusivec4.top/'
        content { includeGroup 'top.theillusivec4.curios' }
    }
    flatDir {
        dirs 'lib'
    }
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    // Use the sibling core project's published Maven repository while developing locally.
    // The GitHub repository below remains the normal source for clean checkouts.
    maven {
        name = 'ShapeShifterCurseLocal'
        url = uri('../shape-shifter-curse-forge/maven-repo/')
    }
    maven {
        name = 'ShapeShifterCurseGitHub'
        url = uri('https://raw.githubusercontent.com/gengyoubo/shape-shifter-curse-forge/master/maven-repo/')
    }
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex 'software\\.bernie.*'
            includeGroup 'com.eliotlash.mclib'
        }
    }
}
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation fg.deobf("curse.maven:shape-shifter-curse-forge-1683902:9104450")
    implementation fg.deobf("curse.maven:jei-238222:9058038")
    implementation fg.deobf("top.theillusivec4.curios:curios-forge:5.9.1+1.20.1")
    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-${project.minecraft_version}:${project.geckolib_version}")
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

mixin {
    add sourceSets.main, 'sscfe.refmap.json'
    config 'sscfe.mixins.json'
}
tasks.named('processResources', ProcessResources).configure {
    // MixinGradle generates the refmap under compileJava's temporary directory. IDE/dev
    // launches use build/resources/main directly, so make the refmap available there too.
    dependsOn tasks.named('compileJava')
    from(layout.buildDirectory.dir('tmp/compileJava')) {
        include 'sscfe.refmap.json'
    }
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// ForgeGradle exposes the add-on source as a dev mod, but does not always make external
// mod dependencies visible to FML's mod-file scan when runClient is launched from this
// standalone project. Stage the actual mod dependencies into the dev game directory.
tasks.register('stageDevModDependencies', Copy) {
    from configurations.runtimeClasspath.filter { file ->
        file.name.contains('shape_shifter_curse') || file.name.startsWith('geckolib-forge-')
                || file.name.startsWith('curios-forge-')
    }
    into file('run/mods')
}

tasks.configureEach {
    if (name == 'runGameTestServer') {
        dependsOn 'testClasses'
    }
    if (name == 'runClient') {
        dependsOn 'classes', 'processResources', 'stageDevModDependencies'
    }
}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}
